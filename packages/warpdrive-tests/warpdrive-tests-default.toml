[default]
log_level = ["info", "warpdrive=debug"]

[warpdrive-tests]
wavs_concurrency = true
middleware_concurrency = true
grouping = false
evm_middleware_type = "poa"
p2p = "mdns"
# `stellar_query` drives the `stellar-query` component which calls
# the new `host::get_stellar_chain_config` host fn (see issue #5)
# and then `unimplemented!()`s. The default config includes it so a
# local `cargo test -p warpdrive-tests` run exercises the WIT
# round-trip end-to-end. The CI configs deliberately don't include
# it, so CI stays green while issue #5's follow-up is in flight.
mode = { "isolated" = [{ stellar = "echo_data" }, { stellar = "stellar_query" }] }


# Run all tests
# mode = "all"
# mode = { "isolated" = [{ evm = "echo_data" }, {evm = "multi_operator"}] }
# mode = { "isolated" = [{ evm = "echo_data" }, {evm = "multi_operator"}] }
# mode = { "isolated" = [{ evm = "multi_operator" }] }
# mode = {"isolated" = [
#     {evm = "echo_data"},
#     {evm = "multi_vector"},
#     {cosmos = "permissions"},
# ]}

# Run all ethereum tests (same can be done for cosmos, cross-chain, etc.)
# mode = "all_eth"

# Run a specific test
# mode = { "isolated" = [{ evm = "trigger_backpressure" }] }

# Run a few specific tests
# mode = {"isolated" = [
#     {evm = "echo_data"},
#     {evm = "multi_vector"},
#     {cosmos = "permissions"},
# ]}

# Load components from the registry
# registry = true

# Send tracing to Jaeger
# jaeger = "http://localhost:4317"

# Send metrics to Prometheus
# prometheus = "http://localhost:9090"
