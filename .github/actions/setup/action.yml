name: "Repo setup"
description: "Common CI setup steps (tools, deps, caches, etc.)"

inputs:
  github-token:
    description: "GitHub token for authenticated API requests (avoids rate limits)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ inputs.github-token }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown, wasm32v1-none

    - name: Install Task
      uses: arduino/setup-task@v2
      with:
        version: 3.x

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1

    - name: Install Stellar CLI
      shell: bash
      env:
        STELLAR_CLI_VERSION: "26.0.0"
      run: |
        curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
          | sudo tar -xz -C /usr/local/bin stellar
        stellar --version

    - name: Create placeholder dist folder for macro expansion
      shell: bash
      run: mkdir -p app/dist

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        add-job-id: true
