# See the matching note in `examples/contracts/stellar/mock_submit_eth/Cargo.toml`
# — empty `[workspace]` makes cargo treat this contract as its own
# workspace root, so cargo doesn't walk up past the warpdrive
# workspace into whatever outer Cargo.toml might exist on disk.
[workspace]

[package]
name = "warpdrive-stellar-trigger"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "25"

[dev-dependencies]
soroban-sdk = { version = "25", features = ["testutils"] }

[profile.release]
overflow-checks = true
