# Empty `[workspace]` makes cargo treat this Cargo.toml as its own
# workspace root and stop walking up. Without it, cargo's resolver
# walks past the warpdrive workspace root (which excludes this
# contract) and lands on whatever outer Cargo.toml exists on disk
# — e.g. when this checkout sits inside another git worktree's
# tree, cargo finds the outer worktree's Cargo.toml and errors
# with "current package believes it's in a workspace when it's
# not". Soroban contracts are built standalone via `stellar
# contract build`, so they don't belong in the warpdrive workspace
# anyway; this just makes that explicit.
[workspace]

[package]
name = "warpdrive-stellar-mock-submit-xlm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "26", features = ["alloc"] }
warpdrive-shared = { version = "0.2.4" }

[dev-dependencies]
soroban-sdk = { version = "26", features = ["testutils"] }

[profile.release]
overflow-checks = true
